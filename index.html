<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet Custom - Premium</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --p: #2d5a27; --s: #c5a059; --bg: #fdfcf9; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; color: #333; }
        .container { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* สไตล์ Slider เมนูและวัตถุดิบ */
        .slider-container { display: flex; overflow-x: auto; gap: 15px; padding: 10px 5px; scroll-snap-type: x mandatory; }
        .slider-container::-webkit-scrollbar { display: none; }
        .card { flex: 0 0 180px; background: white; border-radius: 15px; overflow: hidden; border: 1px solid #eee; position: relative; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 130px; object-fit: cover; }
        .card-info { padding: 10px; text-align: center; }
        .stock-tag { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
        .qty-tag { position: absolute; top: 5px; left: 5px; background: var(--p); color: white; width: 25px; height: 25px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 0.8rem; }

        .btn-main { background: var(--p); color: white; width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        .custom-box { background: #f0f4f0; padding: 15px; border-radius: 15px; margin-top: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        
        /* สรุปตระกร้า */
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้า 1: ลงชื่อ -->
    <div id="p1" class="page active">
        <h1 style="text-align:center; color: var(--p);">Nature Gourmet</h1>
        <p style="text-align:center;">กรุณาระบุข้อมูลผู้สั่ง</p>
        <input type="text" id="custName" placeholder="ชื่อเล่น/ชื่อลูกค้า">
        <input type="tel" id="custTel" placeholder="เบอร์โทรศัพท์">
        <button class="btn-main" onclick="go(2)">เข้าสู่หน้าสั่งอาหาร ➔</button>
    </div>

    <!-- หน้า 2: เลือกเมนูหลัก -->
    <div id="p2" class="page">
        <h3>1. เลือกเมนูหลัก (จิ้มที่รูป)</h3>
        <div class="slider-container" id="main-menu"></div>
        
        <div class="custom-box">
            <h3>2. วัตถุดิบพิเศษ (ถ้ามี)</h3>
            <p style="font-size:0.8rem; color: #666;">เลือกวัตถุดิบและระบุวิธีทำให้เราด้วยนะ</p>
            <div class="slider-container" id="ingredient-menu"></div>
            <textarea id="cookMethod" placeholder="เช่น หั่นบางๆ, ตำพอแหลก, ไม่ใส่รากผักชี..."></textarea>
        </div>

        <div style="margin-top: 20px; background: white; padding: 15px; border-top: 2px solid #eee;">
            <div id="cart-summary"></div>
            <div style="display:flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-top: 10px;">
                <span>ยอดรวม:</span>
                <span id="totalPrice" style="color:var(--p)">0 ฿</span>
            </div>
            <button class="btn-main" onclick="go(3)">ยืนยันรายการ/ชำระเงิน</button>
        </div>
    </div>

    <!-- หน้า 3: ชำระเงิน -->
    <div id="p3" class="page">
        <h2 style="text-align:center;">ชำระเงิน</h2>
        <div style="text-align:center; background:#f9f9f9; padding:20px; border-radius:20px;">
            <p>ยอดที่ต้องโอน: <strong id="payTotal" style="font-size:1.5rem; color:var(--p)">0 ฿</strong></p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PROMPTPAY" style="border-radius:10px;">
            <p style="font-size:0.8rem; margin-top:10px;">แนบสลิปเพื่อยืนยันออเดอร์</p>
            <input type="file" id="slipFile">
        </div>
        <button class="btn-main" onclick="confirmOrder()">ยืนยันออเดอร์เรียบร้อย ✨</button>
        <button class="btn-main" style="background:#ccc" onclick="go(2)">กลับไปแก้ไข</button>
    </div>

    <!-- หน้า 4: ขอบคุณ -->
    <div id="p4" class="page" style="text-align:center; padding-top:100px;">
        <h1 style="font-size:4rem;">✅</h1>
        <h2>ออเดอร์ส่งถึงแม่ค้าแล้ว!</h2>
        <p>รอรับความอร่อยได้เลยครับ/ค่ะ</p>
        <button class="btn-main" onclick="location.reload()">กลับหน้าแรก</button>
    </div>
</div>

<script>
    // --- 1. CONFIG FIREBASE (ใส่ค่าของคุณตรงนี้) ---
    const firebaseConfig = {
        apiKey: "AIza...", 
        databaseURL: "https://your-db-url.firebaseio.com",
        projectId: "your-project-id"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 2. ข้อมูลสินค้าและวัตถุดิบ (กำหนดสต็อกตรงนี้) ---
    const mainFoods = [
        { id: 'f1', name: 'กะเพราหมูกรอบ', price: 70, stock: 10, img: 'https://images.unsplash.com/photo-1555126634-323283e090fa?w=300' },
        { id: 'f2', name: 'ข้าวผัดต้มยำ', price: 85, stock: 5, img: 'https://images.unsplash.com/photo-1559339352-11d035aa65de?w=300' }
    ];

    const ingredients = [
        { id: 'i1', name: 'ผักชี', price: 5, stock: 2, img: 'https://images.unsplash.com/photo-1588873281272-13963435639f?w=300' },
        { id: 'i2', name: 'พริกสด', price: 2, stock: 15, img: 'https://images.unsplash.com/photo-1588253518679-119c3136782a?w=300' },
        { id: 'i3', name: 'ไข่ดาว', price: 10, stock: 20, img: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=300' }
    ];

    let cart = {}; 

    // --- 3. ฟังก์ชันแสดงผล ---
    function renderList(data, containerId, isIngredient) {
        const container = document.getElementById(containerId);
        container.innerHTML = data.map(item => {
            cart[item.id] = 0;
            return `
                <div class="card" onclick="addToCart('${item.id}', ${item.stock}, ${isIngredient})">
                    <div class="stock-tag" id="stock-${item.id}">เหลือ ${item.stock}</div>
                    <div class="qty-tag" id="qty-${item.id}">0</div>
                    <img src="${item.img}">
                    <div class="card-info">
                        <strong>${item.name}</strong><br>
                        <span style="color:var(--p)">${item.price} ฿</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function addToCart(id, maxStock) {
        if (cart[id] < maxStock) {
            cart[id]++;
            const qtyTag = document.getElementById(`qty-${id}`);
            qtyTag.innerText = cart[id];
            qtyTag.style.display = 'flex';
            calculateTotal();
        } else {
            alert("ขออภัยครับ ของชิ้นนี้เหลือเพียง " + maxStock + " เท่านั้น");
        }
    }

    function calculateTotal() {
        let total = 0;
        let summaryHtml = "";
        
        [...mainFoods, ...ingredients].forEach(item => {
            if (cart[item.id] > 0) {
                total += cart[item.id] * item.price;
                summaryHtml += `<div class="cart-item"><span>${item.name} x ${cart[item.id]}</span><span>${cart[item.id] * item.price} ฿</span></div>`;
            }
        });

        document.getElementById('totalPrice').innerText = total + " ฿";
        document.getElementById('payTotal').innerText = total + " ฿";
        document.getElementById('cart-summary').innerHTML = summaryHtml;
    }

    function go(page) {
        if (page === 2 && (!document.getElementById('custName').value)) return alert("ใส่ชื่อหน่อยนะค้าบ");
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('p' + page).classList.add('active');
        window.scrollTo(0,0);
    }

    // --- 4. ฟังก์ชันส่งออเดอร์ (แก้บัคออเดอร์ไม่ขึ้น) ---
    function confirmOrder() {
        const name = document.getElementById('custName').value;
        const tel = document.getElementById('custTel').value;
        const method = document.getElementById('cookMethod').value;
        const total = document.getElementById('totalPrice').innerText;

        if (total === "0 ฿") return alert("ยังไม่ได้เลือกอะไรเลยจ้า");

        const orderData = {
            customer: name,
            tel: tel,
            items: cart,
            cooking_instruction: method,
            total_price: total,
            status: "Pending",
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        // ใช้ .push() เพื่อสร้าง ID ใหม่เสมอ ป้องกันออเดอร์หาย
        db.ref('orders').push(orderData)
            .then(() => {
                go(4);
            })
            .catch((error) => {
                alert("เกิดข้อผิดพลาด: " + error.message);
                console.error("Firebase Error:", error);
            });
    }

    window.onload = () => {
        renderList(mainFoods, 'main-menu', false);
        renderList(ingredients, 'ingredient-menu', true);
    };
</script>
</body>
</html>
