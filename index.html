<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet - Premium Order</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #2d5a27; --s: #c5a059; --bg: #fdfcf9; --red: #e74c3c; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); margin: 0; color: #333; }
        .container { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        
        .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1, h2 { color: var(--p); font-weight: 700; text-align: center; }
        .input-box { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        
        /* Food Card */
        .food-item { display: flex; gap: 15px; background: #fff; padding: 12px; border-radius: 18px; margin-bottom: 15px; border: 1px solid #f0f0f0; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .food-img { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; }
        .stock-tag { font-size: 0.8rem; color: var(--s); font-weight: bold; }
        
        /* Payment Styles */
        .pay-option { display: flex; gap: 10px; margin: 15px 0; }
        .pay-btn { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; text-align: center; cursor: pointer; font-weight: 500; }
        .pay-btn.selected { border-color: var(--p); background: #eef5ee; color: var(--p); }
        
        #error-msg { color: var(--red); text-align: center; font-weight: bold; display: none; margin-top: 10px; border: 1px solid var(--red); padding: 10px; border-radius: 8px; }

        .btn-main { background: var(--p); color: white; width: 100%; padding: 18px; border: none; border-radius: 15px; font-size: 1.2rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .qty-control { display: flex; align-items: center; gap: 15px; }
        .q-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: #eee; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้า 1: เข้าสู่ระบบ -->
    <div id="p1" class="page active">
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500" style="width:100%; border-radius: 0 0 30px 30px;">
        <h1>Nature Gourmet</h1>
        <p style="text-align:center">กรุณาระบุข้อมูลเพื่อเริ่มสั่งอาหาร</p>
        <input type="text" id="name" class="input-box" placeholder="ชื่อเล่น/ชื่อลูกค้า">
        <input type="tel" id="tel" class="input-box" placeholder="เบอร์โทรศัพท์">
        <button class="btn-main" onclick="go(2)">เริ่มสั่งอาหารเลย ➔</button>
    </div>

    <!-- หน้า 2: เลือกเมนู -->
    <div id="p2" class="page">
        <h2>เมนูแนะนำวันนี้</h2>
        <div id="menu-list"></div>
        <button class="btn-main" style="background: #555; font-size: 0.9rem;" onclick="getLocation()">📍 ปักหมุดที่อยู่จัดส่ง (GPS)</button>
        <p id="gps-status" style="font-size: 0.8rem; text-align: center; color: green;"></p>
        
        <div style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px;">
            <div style="display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700;">
                <span>ยอดรวมทั้งหมด:</span>
                <span id="total-price" style="color:var(--p)">0 ฿</span>
            </div>
            <button class="btn-main" onclick="go(3)">ไปที่การชำระเงิน</button>
        </div>
    </div>

    <!-- หน้า 3: ชำระเงิน -->
    <div id="p3" class="page">
        <h2>สรุปรายการสั่งซื้อ</h2>
        <div class="pay-option">
            <div class="pay-btn" id="opt-cash" onclick="setPay('cash')">เงินสด</div>
            <div id="opt-transfer" class="pay-btn" onclick="setPay('transfer')">โอนผ่าน QR</div>
        </div>

        <div id="qr-area" style="display:none; text-align: center;">
            <p>สแกนที่นี่เพื่อชำระเงิน</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PROMPTPAY-098XXXXXXX" style="border: 5px solid #eee; border-radius: 10px;">
            <p>แนบสลิปการโอน:</p>
            <input type="file" id="slip-file" class="input-box">
        </div>

        <div id="error-msg">⚠️ คุณลูกค้ายังไม่ได้แนบสลิปการโอนเงินนะครับ/ค่ะ!</div>

        <button class="btn-main" onclick="submitOrder()">ยืนยันออเดอร์ ✨</button>
        <button class="btn-main" style="background:#ccc" onclick="go(2)">กลับไปแก้เมนู</button>
    </div>

    <!-- หน้า 4: สำเร็จ -->
    <div id="p4" class="page" style="text-align:center; padding-top: 100px;">
        <h1 style="font-size: 3rem;">🎉</h1>
        <h2>สั่งเรียบร้อยแล้ว!</h2>
        <p>รอรับความอร่อยได้เลยครับ/ค่ะ</p>
        <button class="btn-main" onclick="location.reload()">สั่งอีกครั้ง</button>
    </div>
</div>

<script>
    // --- ตั้งค่า Firebase ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- ข้อมูลเมนู ---
    const foods = [
        { id: 1, name: 'กะเพราหมูกรอบ', price: 70, stock: 15, img: 'https://images.unsplash.com/photo-1555126634-323283e090fa?w=200' },
        { id: 2, name: 'ข้าวผัดต้มยำ', price: 85, stock: 10, img: 'https://images.unsplash.com/photo-1559339352-11d035aa65de?w=200' },
        { id: 3, name: 'พะแนงหมูนุ่ม', price: 65, stock: 8, img: 'https://images.unsplash.com/photo-1559844641-33758223b20e?w=200' },
        { id: 4, name: 'ผัดไทยกุ้งสด', price: 85, stock: 12, img: 'https://images.unsplash.com/photo-1559496417-e7f25cb247f3?w=200' },
        { id: 5, name: 'ต้มยำกุ้งน้ำข้น', price: 150, stock: 5, img: 'https://images.unsplash.com/photo-1548943487-a2e4e43b4853?w=200' }
    ];

    let cart = {};
    let payMethod = '';
    let userLoc = "ไม่ระบุ GPS";

    function renderMenu() {
        const list = document.getElementById('menu-list');
        list.innerHTML = foods.map(f => {
            cart[f.id] = 0;
            return `
                <div class="food-item">
                    <img src="${f.img}" class="food-img">
                    <div style="flex:1">
                        <div class="food-name" style="font-weight:700">${f.name}</div>
                        <div style="color:var(--p); font-weight:700">${f.price} ฿</div>
                        <div class="stock-tag">คงเหลือ ${f.stock} จาน</div>
                    </div>
                    <div class="qty-control">
                        <button class="q-btn" onclick="updateQty(${f.id}, -1)">-</button>
                        <span id="q-${f.id}" style="font-weight:700">0</span>
                        <button class="q-btn" onclick="updateQty(${f.id}, 1)">+</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateQty(id, change) {
        const f = foods.find(x => x.id === id);
        let newQty = cart[id] + change;
        if (newQty >= 0 && newQty <= f.stock) {
            cart[id] = newQty;
            document.getElementById(`q-${id}`).innerText = newQty;
            calc();
        } else if (newQty > f.stock) {
            alert("ขออภัยครับ สินค้าชิ้นนี้เหลือเท่านี้จริงๆ");
        }
    }

    function calc() {
        let total = 0;
        foods.forEach(f => total += cart[f.id] * f.price);
        document.getElementById('total-price').innerText = total + " ฿";
    }

    function setPay(m) {
        payMethod = m;
        document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('opt-' + m).classList.add('selected');
        document.getElementById('qr-area').style.display = (m === 'transfer') ? 'block' : 'none';
        document.getElementById('error-msg').style.display = 'none';
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                userLoc = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById('gps-status').innerText = "✅ ปักหมุดตำแหน่งเรียบร้อย!";
            });
        }
    }

    function go(p) {
        if (p === 2 && (!document.getElementById('name').value || !document.getElementById('tel').value)) {
            return alert("ใส่ชื่อและเบอร์โทรหน่อยนะค้าบ");
        }
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById('p' + p).classList.add('active');
        window.scrollTo(0,0);
    }

    function submitOrder() {
        const error = document.getElementById('error-msg');
        if (!payMethod) return alert("เลือกวิธีชำระเงินด้วยจ้า");
        
        // ตรวจสอบว่าโอนเงินแต่ไม่แนบรูปหรือไม่
        if (payMethod === 'transfer' && !document.getElementById('slip-file').value) {
            error.style.display = 'block';
            return;
        }

        const orderData = {
            name: document.getElementById('name').value,
            tel: document.getElementById('tel').value,
            items: cart,
            total: document.getElementById('total-price').innerText,
            payment: payMethod,
            location: userLoc,
            time: new Date().toLocaleString()
        };

        db.ref('orders').push(orderData)
            .then(() => go(4))
            .catch(err => alert("เกิดข้อผิดพลาด: " + err.message));
    }

    window.onload = renderMenu;
</script>

</body>
</html>
