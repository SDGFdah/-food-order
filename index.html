<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งอาหารอัจฉริยะ</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #2ecc71; --secondary: #e67e22; --danger: #e74c3c; }
        body { font-family: 'Kanit', sans-serif; background:#f4f7f6; margin:0; color: #333; }
        .container { display:flex; flex-wrap:wrap; max-width: 1200px; margin: auto; }
        .box { flex:1; min-width:350px; padding:20px; box-sizing: border-box; }
        .card-ui { background:white; padding:20px; border-radius:15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Menu Grid */
        .menu-item { display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; padding: 10px 0; }
        .menu-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        
        input, select, textarea { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing: border-box; }
        button { width:100%; padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; transition: 0.3s; margin-top: 5px; }
        .btn-order { background: var(--primary); color:white; font-size: 1.1em; }
        .btn-gps { background: #3498db; color:white; }
        
        /* Order Cards */
        .order-card { background:white; padding:15px; margin:10px 0; border-radius:10px; border-left:8px solid var(--secondary); position: relative; }
        .status-badge { display:inline-block; padding:3px 8px; border-radius:5px; font-size:0.8em; background:#eee; }
        .qr-area { text-align: center; margin-top: 10px; }
        .qr-area img { width: 150px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ฝั่งลูกค้า: สั่งอาหาร -->
    <div class="box">
        <div class="card-ui">
            <h2>🍛 สั่งอาหาร/จองล่วงหน้า</h2>
            <div id="menu-list">
                <!-- เมนูจะโหลดจาก JavaScript -->
            </div>
            
            <hr>
            <input id="name" placeholder="ชื่อผู้สั่ง">
            <input id="phone" placeholder="เบอร์โทรศัพท์" type="tel">
            
            <select id="order_type">
                <option value="pickup">📍 มารับเองที่ร้าน (จอง)</option>
                <option value="delivery">🚚 ให้ไปส่ง (ใส่ที่อยู่/GPS)</option>
            </select>
            
            <div id="address_section" style="display:none;">
                <textarea id="address" placeholder="ที่อยู่โดยละเอียด"></textarea>
                <button class="btn-gps" onclick="getLocation()">📌 แชร์ตำแหน่ง GPS ปัจจุบัน</button>
                <p id="gps_status" style="font-size:0.8em; color:gray;"></p>
            </div>

            <button class="btn-order" onclick="placeOrder()">ยืนยันการสั่งซื้อ</button>
        </div>
        
        <div class="card-ui">
            <h4>💬 ความคิดเห็นลูกค้า</h4>
            <input id="comment_name" placeholder="ชื่อ">
            <input id="comment_text" placeholder="รสชาติเป็นอย่างไรบ้าง?">
            <button onclick="sendComment()">ส่งความเห็น</button>
        </div>
    </div>

    <!-- ฝั่งร้านค้า: จัดการออเดอร์ -->
    <div class="box">
        <div class="card-ui" style="background: #2c3e50; color: white;">
            <h3>📦 จัดการออเดอร์ (<span id="count">0</span>)</h3>
            <p>ยอดรวมวันนี้: <span id="daily_total">0</span> บาท</p>
        </div>
        <div id="order_list"></div>
    </div>

</div>

<!-- Audio Elements (ใส่ไฟล์เสียงที่คุณต้องการ) -->
<audio id="sound_new" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>
<audio id="sound_cancel" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>

<script>
<!-- 1. เรียกใช้ Library ของ Firebase (ต้องมี 2 อันนี้) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 2. ตั้งค่าการเชื่อมต่อ (เอาตัวเลขและลิงก์ของคุณมาใส่)
  const firebaseConfig = {
    apiKey: "เอา API Key ของคุณมาวางตรงนี้",
    authDomain: "project-8472595372192265726.firebaseapp.com",
    databaseURL: "https://project-8472595372192265726-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "project-8472595372192265726",
    storageBucket: "project-8472595372192265726.appspot.com",
    messagingSenderId: "847259537219",
    appId: "เอา App ID ของคุณมาวางตรงนี้"
  };

  // 3. เริ่มทำงาน
  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database().ref('orders'); // <--- ชื่อหัวข้อที่จะไปแทนที่ null

  // 4. ฟังก์ชันตอนกดปุ่มสั่งอาหาร
  function submitOrder() {
    // สมมติว่ามีช่องกรอกชื่อ ID ว่า "customerName"
    const name = document.getElementById('customerName').value; 
    
    db.push({
      name: name,
      time: new Date().toLocaleString(),
      status: "รอดำเนินการ"
    })
    .then(() => {
      alert("สั่งอาหารสำเร็จ! ข้อมูลไปโผล่ที่ Firebase แล้ว");
    })
    .catch((error) => {
      alert("เกิดข้อผิดพลาด: " + error.message);
    });
  }
</script>
</script>

</body>
</html>
