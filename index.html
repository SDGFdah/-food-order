<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet Admin - Super Sonic</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background: #1a3c15; margin: 0; padding: 15px; color: #333; }
        .header { text-align: center; color: white; margin-bottom: 20px; }
        
        /* ปุ่มเบอร์ฉุกเฉิน */
        .emergency-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-ems { flex: 1; padding: 12px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; font-size: 1rem; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .police { background: #2c3e50; } .ambulance { background: #c0392b; } .fire { background: #d35400; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        
        .order-card { 
            background: white; border-radius: 20px; padding: 20px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); position: relative;
            border-left: 10px solid #e67e22; animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        
        .status-tag { position: absolute; top: 15px; right: 15px; background: #2d5a27; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
        .cust-name { font-size: 1.4rem; color: #1a3c15; font-weight: 600; }
        .cust-tel { color: #e67e22; font-weight: bold; font-size: 1.2rem; text-decoration: underline; }
        
        .item-box { background: #f9fdf9; padding: 15px; border-radius: 15px; margin: 15px 0; border: 2px solid #eee; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1.2rem; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        .qty-badge { background: #1a3c15; color: #fff; padding: 2px 12px; border-radius: 8px; font-weight: bold; }

        .btn-done { background: #27ae60; color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.2rem; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-done:active { transform: scale(0.95); background: #219150; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ออเดอร์ใหม่ (โหมดความเร็วสูง) ⚡</h1>
    </div>

    <div class="emergency-bar">
        <a href="tel:191" class="btn-ems police">🚓 ตำรวจ 191</a>
        <a href="tel:1669" class="btn-ems ambulance">🚑 กู้ชีพ 1669</a>
        <a href="tel:199" class="btn-ems fire">🚒 ดับเพลิง 199</a>
    </div>

    <div class="order-grid" id="order-display">
        <!-- ออเดอร์จะเด้งเข้าตรงนี้ทันที -->
    </div>

    <audio id="ding-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    // [1] Mapping ชื่อเมนู (ใส่ให้ตรงกับหน้าสั่งนะพี่)
    const menuMapping = {
        'f1': 'กะเพราหมูกรอบ',
        'f2': 'ข้าวผัดต้มยำ',
        'f3': 'ผัดไทยกุ้งสด',
        'i1': 'ผักชี (พิเศษ)',
        'i2': 'พริกสด',
        'i3': 'ไข่ดาว',
        'i4': 'ไข่เจียว'
    };

    // [2] Firebase Config (แก้เป็นของพี่นะ)
    const firebaseConfig = {
        apiKey: "AIza...",
        databaseURL: "https://your-db-url.asia-southeast1.firebasedatabase.app", 
        projectId: "your-project-id"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const orderDisplay = document.getElementById('order-display');
    const dingSound = document.getElementById('ding-sound');

    // เสียงผู้หญิงพูด (หวานและเร็ว)
    function speakCancel() {
        const msg = new SpeechSynthesisUtterance("มีคนยกเลิกออเดอร์ค่ะ");
        msg.lang = 'th-TH';
        msg.rate = 1.1; 
        msg.pitch = 1.2;
        window.speechSynthesis.speak(msg);
    }

    // [3] เทคนิคการโหลดแบบ "ทันที" (Child Added)
    // วิธีนี้จะเร็วกว่า 'on value' เพราะมันจะไม่รอให้โหลดครบทุกอันถึงค่อยแสดงผล
    let initialDataLoaded = false;

    db.ref('orders').on('child_added', (snapshot) => {
        const key = snapshot.key;
        const order = snapshot.val();
        renderOrderCard(key, order, true); // วาดการ์ดใหม่ไว้บนสุด

        if (initialDataLoaded) {
            dingSound.play().catch(() => {}); // เสียงติ๊ง
        }
    });

    db.ref('orders').on('child_removed', (snapshot) => {
        const card = document.getElementById(`card-${snapshot.key}`);
        if (card) {
            card.remove();
            speakCancel(); // เสียงแจ้งเตือนยกเลิก
        }
    });

    // ตรวจสอบว่าโหลดครั้งแรกเสร็จหรือยัง (เพื่อไม่ให้เสียงดังรัวๆ ตอนเปิดหน้า)
    db.ref('orders').once('value', () => {
        initialDataLoaded = true;
        if (orderDisplay.innerHTML === "") {
            orderDisplay.innerHTML = `<div id="empty-msg" style="color: white; text-align: center; grid-column: 1/-1; padding: 50px;">ไม่มีออเดอร์ค้างค่ะ 😇</div>`;
        }
    });

    function renderOrderCard(key, order, isNew = false) {
        // ลบข้อความ "ไม่มีออเดอร์" ออกถ้ามีการ์ดใหม่เข้า
        const emptyMsg = document.getElementById('empty-msg');
        if (emptyMsg) emptyMsg.remove();

        const date = new Date(order.timestamp).toLocaleTimeString('th-TH');
        let itemsHtml = "";
        
        for (let id in order.items) {
            if (order.items[id] > 0) {
                const name = menuMapping[id] || id;
                itemsHtml += `
                    <div class="item-row">
                        <span>${name}</span>
                        <span class="qty-badge">${order.items[id]}</span>
                    </div>`;
            }
        }

        const cardHtml = `
            <div class="order-card" id="card-${key}">
                <div class="status-tag">${order.payment_type === 'scan' ? '📱 โอนเงิน' : '💵 เงินสด'}</div>
                <div class="cust-name">คุณ ${order.customer}</div>
                <a href="tel:${order.tel}" class="cust-tel">📞 ${order.tel}</a>
                
                <div class="item-box">
                    ${itemsHtml}
                    <div style="color: #e67e22; font-size: 0.95rem; margin-top: 10px; font-weight: bold;">
                        📌 โน้ต: ${order.cooking_instruction || '-'}
                    </div>
                </div>
                
                <div style="text-align: right; font-size: 1.3rem; font-weight: bold; color: #1a3c15;">
                    ยอดสุทธิ: ${order.total_price}
                </div>
                
                <button class="btn-done" onclick="finishOrder('${key}')">✅ ทำเสร็จแล้ว</button>
            </div>
        `;

        if (isNew) {
            orderDisplay.insertAdjacentHTML('afterbegin', cardHtml); // เอาไว้บนสุด
        } else {
            orderDisplay.innerHTML += cardHtml;
        }
    }

    function finishOrder(key) {
        if (confirm("ทำออเดอร์นี้เสร็จแล้วใช่ไหมคะ?")) {
            db.ref('orders/' + key).remove();
        }
    }
</script>
</body>
</html>
