<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Gourmet Premium + GPS</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary: #3d5a44;
            --accent: #c5a059;
            --bg: #fdfcf9;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg);
            margin: 0;
            color: #2d3436;
        }

        .main-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .page {
            display: none;
            padding: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .page.active { display: block; }

        .hero {
            height: 50vh;
            margin: -20px -20px 20px -20px;
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1000');
            background-size: cover;
            background-position: center;
            border-radius: 0 0 40px 40px;
            display: flex;
            align-items: flex-end;
            position: relative;
        }

        .hero-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 30px;
            width: 100%;
            border-radius: 0 0 40px 40px;
            color: white;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--primary); }
        
        .modern-input {
            width: 100%;
            padding: 15px;
            border: 1.5px solid #eee;
            border-radius: 15px;
            background: #f9f9f9;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .food-card {
            display: flex;
            background: white;
            border-radius: 20px;
            margin-bottom: 15px;
            padding: 10px;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            border: 1px solid #f1f1f1;
        }

        .food-img { width: 90px; height: 90px; border-radius: 15px; object-fit: cover; }
        .food-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .food-name { font-size: 1rem; font-weight: 600; margin: 0; }
        .food-price { color: var(--primary); font-weight: 600; }

        .qty-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f1f3f0;
            border-radius: 10px;
            padding: 2px 8px;
        }

        .btn-qty { border: none; background: none; font-size: 1.2rem; color: var(--primary); cursor: pointer; }

        .gps-button {
            background: #e8f0e9;
            color: var(--primary);
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 15px;
            width: 100%;
            margin-bottom: 15px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(61,90,68,0.2);
        }

        .sticky-footer {
            position: sticky;
            bottom: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            margin: 0 -20px -20px -20px;
            padding: 15px 20px;
            border-top: 1px solid #eee;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="main-container">

    <!-- หน้าที่ 1: ลงทะเบียน -->
    <div id="p1" class="page active">
        <div class="hero">
            <div class="hero-overlay">
                <h1 style="font-family: 'Playfair Display'; font-size: 2.5rem; margin: 0;">Nature's Table</h1>
                <p>รสชาติระดับพรีเมียม ส่งถึงมือคุณ</p>
            </div>
        </div>
        <div class="input-group">
            <label>ชื่อลูกค้า</label>
            <input type="text" id="custName" class="modern-input" placeholder="ระบุชื่อของคุณ">
        </div>
        <div class="input-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" id="custTel" class="modern-input" placeholder="09x-xxx-xxxx">
        </div>
        <button class="btn-action" onclick="go(2)">ดูเมนูอาหาร ➔</button>
    </div>

    <!-- หน้าที่ 2: เมนูอาหาร -->
    <div id="p2" class="page">
        <h2 style="font-family: 'Playfair Display'; color: var(--primary);">Today's Specials</h2>
        
        <div id="foodList">
            <!-- เมนูจะแสดงที่นี่ -->
        </div>

        <button class="gps-button" id="gpsBtn" onclick="getLocation()">
            📍 <span id="gpsText">กดเพื่อระบุตำแหน่งจัดส่ง (GPS)</span>
        </button>

        <div class="input-group">
            <label>เพิ่มเติม/ที่อยู่จัดส่ง</label>
            <textarea id="note" class="modern-input" style="height: 70px;" placeholder="ระบุรายละเอียดที่อยู่ หรือความต้องการพิเศษ"></textarea>
        </div>

        <div class="sticky-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span>ยอดรวม</span>
                <span id="totalPrice" style="font-weight: 600; color: var(--primary);">0 ฿</span>
            </div>
            <button class="btn-action" onclick="go(3)">ไปหน้าชำระเงิน</button>
        </div>
    </div>

    <!-- หน้าที่ 3: ชำระเงิน -->
    <div id="p3" class="page">
        <h2 style="text-align: center;">ชำระเงิน</h2>
        <div style="background: #f9f9f9; padding: 20px; border-radius: 20px; text-align: center;">
            <p>สแกน QR เพื่อโอนเงิน</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PROMPTPAY" style="border-radius: 10px;">
            <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">แนบสลิปยืนยัน</p>
            <input type="file" id="slip" class="modern-input">
        </div>
        <button class="btn-action" style="margin-top: 20px;" onclick="confirmOrder()">ยืนยันการสั่งซื้อ ✨</button>
        <p onclick="go(2)" style="text-align: center; color: #999; margin-top: 15px; cursor: pointer;">ย้อนกลับ</p>
    </div>

    <!-- หน้าที่ 4: ขอบคุณ -->
    <div id="p4" class="page" style="text-align: center; padding-top: 50px;">
        <h1 style="color: var(--primary); font-size: 2.5rem;">สั่งซื้อสำเร็จ!</h1>
        <div style="padding: 25px; background: #fdfcf9; border-radius: 25px; margin: 20px 0; border: 1px dashed var(--accent);">
            <p>แม่ค้ากำลังเตรียมอาหารให้คุณ</p>
            <p style="font-size: 1.2rem; font-weight: 600;">📞 098-xxx-xxx</p>
            <p style="color: #accent;">ยินดีให้บริการครับ/ค่ะ</p>
        </div>
        <button class="btn-action" onclick="location.reload()">กลับหน้าหลัก</button>
    </div>

</div>

<script>
    // --- 1. ตั้งค่า Firebase (เปลี่ยนเป็นของตัวเอง) ---
    const firebaseConfig = { apiKey: "...", databaseURL: "...", projectId: "..." };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 2. ข้อมูลเมนูอาหาร ---
    const menuData = [
        { id: 'm1', name: 'กะเพราหมูกรอบคลุกฝุ่น', price: 70, img: 'https://images.unsplash.com/photo-1512058560550-42749359a60b?q=80&w=300' },
        { id: 'm2', name: 'พะแนงหมูนุ่มยอดมะพร้าว', price: 65, img: 'https://images.unsplash.com/photo-1559844641-33758223b20e?q=80&w=300' },
        { id: 'm3', name: 'ผัดไทยกุ้งแม่น้ำ', price: 85, img: 'https://images.unsplash.com/photo-1559496417-e7f25cb247f3?q=80&w=300' },
        { id: 'm4', name: 'ข้าวผัดต้มยำทะเลเดือด', price: 90, img: 'https://images.unsplash.com/photo-1559339352-11d035aa65de?q=80&w=300' },
        { id: 'm5', name: 'ต้มยำกุ้งน้ำข้นสูตรคุณแม่', price: 150, img: 'https://images.unsplash.com/photo-1548943487-a2e4e43b4853?q=80&w=300' }
    ];

    let cart = {};
    let userLocation = "ไม่ได้ระบุ GPS";

    // --- 3. ฟังก์ชันสร้างเมนู (ใช้ DOMContentLoaded เพื่อให้มั่นใจว่าโหลดเมนูแน่ๆ) ---
    function renderMenu() {
        const list = document.getElementById('foodList');
        list.innerHTML = ""; // ล้างค่าเก่า
        menuData.forEach(item => {
            cart[item.id] = 0;
            list.innerHTML += `
                <div class="food-card">
                    <img src="${item.img}" class="food-img">
                    <div class="food-content">
                        <p class="food-name">${item.name}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="food-price">${item.price} ฿</span>
                            <div class="qty-wrapper">
                                <button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button>
                                <span id="qty-${item.id}">0</span>
                                <button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function updateQty(id, delta) {
        cart[id] = Math.max(0, cart[id] + delta);
        document.getElementById('qty-' + id).innerText = cart[id];
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0;
        menuData.forEach(item => {
            total += cart[item.id] * item.price;
        });
        document.getElementById('totalPrice').innerText = total + " ฿";
    }

    // --- 4. ฟังก์ชัน GPS ---
    function getLocation() {
        const gpsText = document.getElementById('gpsText');
        if (navigator.geolocation) {
            gpsText.innerText = "กำลังค้นหาตำแหน่ง...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLocation = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                    gpsText.innerText = "📍 ปักหมุดสำเร็จ!";
                    document.getElementById('gpsBtn').style.background = "#d1e7dd";
                },
                (err) => {
                    gpsText.innerText = "ไม่สามารถเข้าถึง GPS ได้";
                    alert("กรุณาเปิดการเข้าถึงตำแหน่งในเบราว์เซอร์");
                }
            );
        } else {
            alert("เบราว์เซอร์ไม่รองรับ GPS");
        }
    }

    // --- 5. การเปลี่ยนหน้า และ ส่งข้อมูล ---
    function go(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('p' + page).classList.add('active');
        window.scrollTo(0,0);
    }

    function confirmOrder() {
        const name = document.getElementById('custName').value;
        const tel = document.getElementById('custTel').value;
        const total = document.getElementById('totalPrice').innerText;
        const note = document.getElementById('note').value;

        if(!name || !tel) return alert("กรุณากรอกชื่อและเบอร์โทร");
        if(total === "0 ฿") return alert("กรุณาเลือกอาหาร");

        db.ref('orders').push({
            customer: name,
            tel: tel,
            items: cart,
            total: total,
            location: userLocation, // ส่งพิกัด GPS ไปด้วย
            note: note,
            time: new Date().toLocaleString()
        }).then(() => go(4));
    }

    // เรียกใช้ฟังก์ชันตอนโหลดหน้าเว็บ
    window.onload = renderMenu;
</script>

</body>
</html>
